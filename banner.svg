<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PhotoPop - photo booth experiences in Sri Lanka" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F86EA0"/>
      <stop offset="0.55" stop-color="#FF5FA2"/>
      <stop offset="1" stop-color="#FF4F9A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FBB6CE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FBB6CE" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <!-- film strips -->
  <g opacity="0.9" transform="rotate(-8 1060 180)">
    <rect x="990" y="60" width="150" height="190" rx="8" fill="#FAF8F9"/>
    <rect x="1002" y="72" width="126" height="126" rx="4" fill="#F86EA0"/>
    <rect x="1002" y="206" width="126" height="32" rx="4" fill="#D9D9DE"/>
  </g>
  <g opacity="0.9" transform="rotate(7 1170 190)">
    <rect x="1100" y="90" width="150" height="190" rx="8" fill="#D9D9DE"/>
    <rect x="1112" y="102" width="126" height="126" rx="4" fill="#FAF8F9"/>
    <rect x="1112" y="236" width="126" height="32" rx="4" fill="#F86EA0"/>
  </g>
  <rect x="48" y="48" width="1184" height="264" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
  <!-- wordmark -->
  <text x="90" y="190" font-family="'Google Sans','Product Sans',Poppins,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="120" letter-spacing="-3">
    <tspan fill="#202020">photo</tspan><tspan fill="#FFFFFF">pop</tspan>
  </text>
  <!-- rotating taglines -->
  <g font-family="'Google Sans','Product Sans',Poppins,'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="30" fill="#FFFFFF">
    <text x="94" y="256" opacity="0">Smile. Pop. Repeat.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="94" y="256" opacity="0">Weddings · Birthdays · Corporate
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    <text x="94" y="256" opacity="0">Photo booth experiences in Sri Lanka
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="94" y="256" opacity="0">Custom frames · Instant prints · Digital sharing
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  </g>
  <rect width="1280" height="360" filter="url(#grain)"/>
</svg>
